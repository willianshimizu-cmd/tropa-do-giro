<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tropa do Giro · Adega Brasil MGA</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root {
  --bg:     #0d0f12;
  --bg2:    #14171c;
  --bg3:    #1c2028;
  --border: rgba(255,255,255,0.08);
  --border2:rgba(255,255,255,0.14);
  --gold:   #d4a847;
  --gold2:  #f0c96a;
  --gold-d: rgba(212,168,71,0.15);
  --red:    #e05555;
  --red-d:  rgba(224,85,85,0.14);
  --blue:   #5b8dee;
  --blue-d: rgba(91,141,238,0.14);
  --green:  #4eb87a;
  --green-d:rgba(78,184,122,0.14);
  --orange: #e07c3a;
  --orange-d:rgba(224,124,58,0.14);
  --text:   #edeae4;
  --text2:  #9a9590;
  --text3:  #5a5753;
  --font-h: 'Syne', sans-serif;
  --font-m: 'IBM Plex Mono', monospace;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-m);
  font-size: 15px;
  line-height: 1.5;
  min-height: 100vh;
  overflow-x: hidden;
}
body::after {
  content: '';
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image:
    linear-gradient(var(--border) 1px, transparent 1px),
    linear-gradient(90deg, var(--border) 1px, transparent 1px);
  background-size: 48px 48px;
}

/* layout */
.wrap { max-width: 1200px; margin: 0 auto; padding: 0 24px; position: relative; z-index: 1; }

/* header */
.header {
  border-bottom: 1px solid var(--border2);
  padding: 28px 0 20px;
  display: flex; align-items: flex-end; justify-content: space-between; gap: 16px;
  flex-wrap: wrap;
}
.header-title { font-family: var(--font-h); font-size: 26px; font-weight: 800; letter-spacing: -0.02em; }
.header-title span { color: var(--gold); }
.date-badge {
  font-size: 11px; color: var(--text3); letter-spacing: 0.08em; text-transform: uppercase;
  background: var(--bg3); border: 1px solid var(--border2);
  padding: 5px 12px; border-radius: 6px;
}

/* KPIs */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; padding: 24px 0 0; }
.kpi {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 10px; padding: 16px 18px;
}
.kpi-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text3); margin-bottom: 6px; }
.kpi-val { font-family: var(--font-h); font-size: 28px; font-weight: 800; line-height: 1; }
.kpi-sub { font-size: 11px; color: var(--text3); margin-top: 4px; }
.gold { color: var(--gold); }
.green { color: var(--green); }
.red { color: var(--red); }
.blue { color: var(--blue); }
.orange { color: var(--orange); }

/* charts */
.charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; padding: 24px 0 0; }
.chart-card {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 10px; padding: 18px 20px;
}
.chart-card.full { grid-column: 1/-1; }
.chart-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text3); margin-bottom: 12px; }
.chart-legend { display: flex; gap: 16px; margin-bottom: 10px; font-size: 11px; color: var(--text2); }
.leg { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: middle; }

/* filial big-number cards */
.filial-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 24px 0 0; }
.filial-card {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 12px; padding: 24px 28px 20px;
  display: flex; flex-direction: column;
}
.filial-card-label {
  font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em;
  color: var(--text3); margin-bottom: 14px;
}
.filial-card-name {
  font-family: var(--font-h); font-size: 20px; font-weight: 800; margin-bottom: 8px;
}
.filial-card-num {
  font-family: var(--font-h); font-size: 76px; font-weight: 800; line-height: 1; margin-bottom: 4px;
}
.filial-card-sub { font-size: 12px; color: var(--text3); margin-bottom: 18px; }
.filial-card-divider { border: none; border-top: 1px solid var(--border); margin: 0 0 16px; }
.filial-card-row { display: flex; align-items: baseline; gap: 8px; }
.filial-card-row-num {
  font-family: var(--font-h); font-size: 34px; font-weight: 800; line-height: 1;
}
.filial-card-row-label { font-size: 12px; color: var(--text3); }
@media (max-width: 600px) {
  .filial-cards { grid-template-columns: 1fr; }
  .filial-card-num { font-size: 54px; }
}

/* rotulos monitoring card */
.rot-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 0;
}
.rot-col {
  padding: 12px 0 4px;
}
.rot-col:first-child { border-right: 1px solid var(--border); padding-right: 28px; }
.rot-col:last-child  { padding-left: 28px; }
.rot-col-header {
  display: flex; align-items: center; gap: 10px; margin-bottom: 14px;
}
.rot-col-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.rot-col-title { font-family: var(--font-h); font-size: 15px; font-weight: 700; }
.rot-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 12px;
}
.rot-row:last-child { border-bottom: none; }
.rot-row-nome { color: var(--text2); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
.rot-row-bar-wrap { flex: 1; margin: 0 12px; }
.rot-row-bar-bg { height: 4px; background: var(--bg3); border-radius: 2px; }
.rot-row-bar-fill { height: 4px; border-radius: 2px; }
.rot-row-num { font-family: var(--font-h); font-size: 13px; font-weight: 700; min-width: 24px; text-align: right; }
.rot-summary {
  display: flex; gap: 24px; margin-top: 16px; padding-top: 14px;
  border-top: 1px solid var(--border2);
}
.rot-summary-item { display: flex; flex-direction: column; gap: 2px; }
.rot-summary-val { font-family: var(--font-h); font-size: 22px; font-weight: 800; }
.rot-summary-label { font-size: 11px; color: var(--text3); }
@media (max-width: 640px) {
  .rot-grid { grid-template-columns: 1fr; }
  .rot-col:first-child { border-right: none; border-bottom: 1px solid var(--border); padding-right: 0; padding-bottom: 16px; }
  .rot-col:last-child { padding-left: 0; padding-top: 16px; }
}

/* section */
.section-head {
  display: flex; align-items: center; gap: 12px;
  padding: 28px 0 14px;
}
.section-title { font-family: var(--font-h); font-size: 17px; font-weight: 700; }
.count-lbl { font-size: 12px; color: var(--text3); background: var(--bg3); border: 1px solid var(--border); padding: 3px 10px; border-radius: 20px; }

/* filters */
.filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.filters select, .filters input {
  background: var(--bg2); border: 1px solid var(--border2);
  color: var(--text); font-family: var(--font-m); font-size: 13px;
  padding: 8px 12px; border-radius: 7px; outline: none;
  cursor: pointer;
}
.filters select:focus, .filters input:focus { border-color: var(--gold); }
.filters input { min-width: 220px; }

/* table */
.table-outer { overflow-x: auto; border-radius: 10px; border: 1px solid var(--border); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead th {
  background: var(--bg3); padding: 11px 14px;
  font-size: 10px; text-transform: uppercase; letter-spacing: 0.09em;
  color: var(--text3); font-weight: 500; text-align: left;
  cursor: pointer; user-select: none; white-space: nowrap;
}
thead th:hover { color: var(--text2); }
tbody tr { border-top: 1px solid var(--border); transition: background 0.1s; }
tbody tr:hover { background: var(--bg3); }
tbody td { padding: 11px 14px; vertical-align: middle; }
.td-cod { font-size: 11px; color: var(--text3); white-space: nowrap; }
.td-name { font-size: 13px; max-width: 260px; }
.td-r { text-align: right; white-space: nowrap; }
.muted { color: var(--text3); }

/* progress bar */
.prog { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
.prog span { min-width: 20px; text-align: right; }
.prog-bg { width: 60px; height: 5px; background: var(--bg3); border-radius: 3px; overflow: hidden; }
.prog-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }
.g-fill { background: var(--gold); }
.b-fill { background: var(--blue); }

/* badges */
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11px; font-weight: 500; letter-spacing: 0.08em;
  text-transform: uppercase; padding: 4px 10px; border-radius: 5px;
  white-space: nowrap;
}
.badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.b-zero    { background: var(--red-d);    color: var(--red);    border: 1px solid rgba(224,85,85,0.22); }
.b-zero::before   { background: var(--red); }
.b-parcial { background: var(--gold-d);   color: var(--gold);   border: 1px solid rgba(212,168,71,0.22); }
.b-parcial::before { background: var(--gold); }
.b-ok      { background: var(--green-d);  color: var(--green);  border: 1px solid rgba(78,184,122,0.22); }
.b-ok::before     { background: var(--green); }
.b-pedido  { background: var(--orange-d); color: var(--orange); border: 1px solid rgba(224,124,58,0.3); }
.b-pedido::before { background: var(--orange); }
.b-trans   { background: var(--blue-d);   color: var(--blue);   border: 1px solid rgba(91,141,238,0.3); }
.b-trans::before  { background: var(--blue); }
.b-na      { background: rgba(255,255,255,0.04); color: var(--text3); border: 1px solid var(--border); }
.b-na::before     { background: var(--text3); }
.b-dividir { background: rgba(160,100,240,0.14); color: #b07ef0; border: 1px solid rgba(160,100,240,0.3); }
.b-dividir::before { background: #b07ef0; }
.b-esgotado { background: rgba(80,80,80,0.25); color: #666; border: 1px solid rgba(120,120,120,0.3); }
.b-esgotado::before { background: #666; }

/* tag novo */
.tag-novo {
  display: inline-flex; align-items: center;
  font-size: 9px; font-weight: 700; letter-spacing: 0.14em;
  text-transform: uppercase; padding: 2px 7px; border-radius: 4px;
  background: rgba(78,184,122,0.18); color: var(--green);
  border: 1px solid rgba(78,184,122,0.35);
  vertical-align: middle; margin-left: 7px;
  animation: pulse-new 2s ease infinite;
}
@keyframes pulse-new { 0%,100%{opacity:1} 50%{opacity:0.5} }

/* empty */
.empty { text-align: center; padding: 36px; color: var(--text3); font-size: 13px; }

/* footer */
.footer { border-top: 1px solid var(--border); padding: 24px 0; margin-top: 40px; font-size: 11px; color: var(--text3); text-align: center; }
</style>
</head>

// ── HELPERS ───────────────────────────────────────────────────────────────────
function pais(nome) {
  const m = nome.match(/· (\w+)$/);
  return m ? m[1] : 'Outro';
}

// ── STATUS ────────────────────────────────────────────────────────────────────
// pedido   = filial zerada + tem F26 → fazer pedido ao CD
// dividir  = só uma filial tem estoque → dividir com a outra
// esgotado = F24=0, F25=0, F26=0 → produto esgotado
// parcial  = está vendendo
// zero     = tem estoque mas não vendeu nada
// na       = sem produto nessa filial
function getStatus(d, fil) {
  if (fil === 'f24') {
    if (d.f24 === 0 && d.f25 > 0 && d.f26 === 0) return 'dividir';
    if (d.f24 === 0 && d.f25 === 0 && d.f26 === 0) return 'esgotado';
    if (d.f24 === 0) return d.f26 > 0 ? 'pedido' : 'na';
    if (d.f24v > 0) return 'parcial';
    return 'zero';
  }
  if (fil === 'f25') {
    if (d.f25 === 0 && d.f24 > 0 && d.f26 === 0) return 'dividir';
    if (d.f24 === 0 && d.f25 === 0 && d.f26 === 0) return 'esgotado';
    if (d.f25 === 0) return d.f26 > 0 ? 'pedido' : 'na';
    if (d.f25v > 0) return 'parcial';
    return 'zero';
  }
  // ambas as filiais
  if (d.f24 === 0 && d.f25 === 0 && d.f26 === 0) return 'esgotado';
  if (d.f24 > 0 && d.f25 === 0 && d.f26 === 0) return 'dividir'; // só F24 → dividir com F25
  if (d.f25 > 0 && d.f24 === 0 && d.f26 === 0) return 'dividir'; // só F25 → dividir com F24
  if ((d.f24 === 0 || d.f25 === 0) && d.f26 > 0) return 'pedido';
  if (d.f24v > 0 || d.f25v > 0) return 'parcial';
  return 'zero';
}

function badgeHtml(st) {
  if (st === 'pedido')   return '<span class="badge b-pedido">🟠 Fazer Pedido</span>';
  if (st === 'dividir')  return '<span class="badge b-dividir">⇄ Dividir Estoque</span>';
  if (st === 'esgotado') return '<span class="badge b-esgotado">✕ Esgotado</span>';
  if (st === 'trans')    return '<span class="badge b-trans">↗ Transferir</span>';
  if (st === 'parcial')  return '<span class="badge b-ok">✓ Vendendo</span>';
  if (st === 'zero')     return '<span class="badge b-zero">Sem venda</span>';
  return '<span class="badge b-na">—</span>';
}

// ── KPIs ──────────────────────────────────────────────────────────────────────
function buildKpis() {
  const d = DATA;
  const skus       = d.length;
  const totalF24   = d.reduce((s,x)=>s+x.f24,0);
  const totalF25   = d.reduce((s,x)=>s+x.f25,0);
  const totalF26   = d.reduce((s,x)=>s+x.f26,0);
  const totalUnid  = totalF24 + totalF25;
  const semVenda   = d.filter(x=>getStatus(x,'all')==='zero').length;
  const pctParado  = Math.round(semVenda/skus*100);
  const pedidos    = d.filter(x=>getStatus(x,'all')==='pedido').length;

  document.getElementById('kpis').innerHTML = `
    <div class="kpi"><div class="kpi-label">SKUs Únicos</div><div class="kpi-val gold">${skus}</div><div class="kpi-sub">rótulos monitorados</div></div>
    <div class="kpi"><div class="kpi-label">F24 Mercadão</div><div class="kpi-val gold">${totalF24}</div><div class="kpi-sub">garrafas em loja</div></div>
    <div class="kpi"><div class="kpi-label">F25 Euclides</div><div class="kpi-val blue">${totalF25}</div><div class="kpi-sub">garrafas em loja</div></div>
    <div class="kpi"><div class="kpi-label">Unidades</div><div class="kpi-val" style="color:var(--green)">${totalUnid}</div><div class="kpi-sub">F24 + F25 nas lojas</div></div>
    <div class="kpi"><div class="kpi-label">Sem venda</div><div class="kpi-val red">${semVenda} <span style="font-size:15px;color:var(--text3)">(${pctParado}%)</span></div><div class="kpi-sub">produtos parados</div></div>
    <div class="kpi"><div class="kpi-label">Fazer Pedido</div><div class="kpi-val orange">${pedidos}</div><div class="kpi-sub">aguardam F26</div></div>
  `;
}
buildKpis();

// ── TABLE ─────────────────────────────────────────────────────────────────────
let sk = '', sd = 1;
function srt(k) { sd = sk===k ? -sd : 1; sk = k; render(); }

function render() {
  const fil = document.getElementById('filFilter').value;
  const st  = document.getElementById('stFilter').value;
  const q   = document.getElementById('search').value.toLowerCase();
  let d = [...DATA];

  if (q) d = d.filter(x => x.nome.toLowerCase().includes(q) || x.cod.includes(q));
  if (st === 'novo')  d = d.filter(x => !KNOWN_CODES.has(x.cod));
  else if (st !== 'all') d = d.filter(x => getStatus(x, fil) === st);

  if (fil === 'f24') d = d.filter(x => x.f24 > 0 || x.f24v !== 0);
  if (fil === 'f25') d = d.filter(x => x.f25 > 0 || x.f25v !== 0);

  if (sk) d.sort((a,b) => {
    if (sk === 'pv') return (a.pv - b.pv) * sd;
    const av = sk==='cod' ? a.cod : a.nome;
    const bv = sk==='cod' ? b.cod : b.nome;
    return av.localeCompare(bv) * sd;
  });

  document.getElementById('countLbl').textContent = `${d.length} produto${d.length!==1?'s':''}`;
  const tb = document.getElementById('tbody');
  if (!d.length) {
    tb.innerHTML = '<tr><td colspan="9" class="empty">Nenhum produto encontrado.</td></tr>';
    return;
  }

  tb.innerHTML = d.map(x => {
    const v4 = Math.max(x.f24v, 0);
    const v5 = Math.max(x.f25v, 0);
    const pct4 = x.f24 > 0 ? Math.min(Math.round(v4 / (x.f24 + v4) * 100), 100) : 0;
    const pct5 = x.f25 > 0 ? Math.min(Math.round(v5 / (x.f25 + v5) * 100), 100) : 0;
    const n4   = x.f24 || '<span class="muted">—</span>';
    const n5   = x.f25 || '<span class="muted">—</span>';
    const n6   = x.f26 || '<span class="muted">—</span>';
    const novo = !KNOWN_CODES.has(x.cod) ? '<span class="tag-novo">✦ Novo</span>' : '';
    const st   = getStatus(x, fil);
    return `<tr>
<td class="td-cod">${x.cod}</td>
<td class="td-name">${x.nome}${novo}</td>
<td class="td-r" style="color:var(--text2);font-size:12px">R$&nbsp;${x.pv.toFixed(2).replace('.',',')}</td>
<td class="td-r">${n4}</td>
<td class="td-r"><div class="prog"><span>${v4 > 0 ? v4 : '—'}</span><div class="prog-bg"><div class="prog-fill g-fill" style="width:${pct4}%"></div></div></div></td>
<td class="td-r">${n5}</td>
<td class="td-r"><div class="prog"><span>${v5 > 0 ? v5 : '—'}</span><div class="prog-bg"><div class="prog-fill b-fill" style="width:${pct5}%"></div></div></div></td>
<td class="td-r">${n6}</td>
<td>${badgeHtml(st)}</td>
</tr>`;
  }).join('');
}

['filFilter','stFilter','search'].forEach(id =>
  document.getElementById(id).addEventListener('input', render)
);
render();
